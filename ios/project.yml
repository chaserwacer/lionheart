name: Lionheart

options:
  bundleIdPrefix: com.chasebalmer
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Lionheart:
    type: application
    platform: iOS
    sources:
      - path: Lionheart
    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig
    # HealthKit, read-only: Lionheart reads the workouts other apps write to Apple Health and never
    # writes there itself (a Debug build may seed invented runs into a simulator's store; see
    # Health/SampleRuns.swift). The capability is available on the free developer tier.
    entitlements:
      path: Lionheart/Lionheart.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Shared with LionheartWidgets: the app leaves today's glance there for the Home and Lock
        # Screen widgets (Store/Glance/TodayGlanceFile.swift). Available on the free developer tier.
        com.apple.security.application-groups: [group.com.chasebalmer.lionheart]
    dependencies:
      # Embeds the widget extension in the app's PlugIns folder, which is the only way a Live
      # Activity's views are ever found: ActivityKit renders them in the extension's process, so an
      # app that links ActivityKit but ships no extension can request an activity and will only
      # ever draw a blank one.
      - target: LionheartWorkoutActivity
      # The Home and Lock Screen widgets, embedded the same way.
      - target: LionheartWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chasebalmer.lionheart
        PRODUCT_NAME: Lionheart
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Resources/AppIcon.icon, an Icon Composer document drawn by Scripts/render-brand-assets.sh:
        # Liquid Glass on iOS 26, and flat light, dark and tinted pictures the asset compiler renders
        # from it for iOS 18.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: ""
        CODE_SIGN_STYLE: Automatic
        # Code signing stays on even for the simulator, which signs ad-hoc and needs no team.
        # Turning it off strips the application-identifier entitlement, and without that every
        # Keychain write fails with errSecMissingEntitlement — so the athlete would appear to sign
        # in and be signed out again on the next launch, with nothing saying why.
    info:
      path: Lionheart/Info.plist
      properties:
        # The athlete sees Tempo; everything internal — targets, bundle identifiers, the Keychain and
        # the App Group — keeps the Lionheart name, since changing those breaks an installed app.
        CFBundleDisplayName: Tempo
        # The short name, which the Shortcuts link and other system surfaces read instead of the
        # display name. PRODUCT_NAME, and with it the executable, stays Lionheart.
        CFBundleName: Tempo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIUserInterfaceStyle: Automatic
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Declaring a launch screen is what tells iOS the app is built for the full display. Without
        # it the app runs letterboxed in compatibility mode on every modern device — and because
        # this project supplies its own Info.plist, the INFOPLIST_KEY_UILaunchScreen_Generation
        # build setting never reaches it. The mark on Graphite, in both appearances: OpeningView's
        # first frame draws exactly this, so the hand-over to the app shows no seam.
        UILaunchScreen:
          UIColorName: Graphite
          UIImageName: LaunchMark
        # Without this the app cannot start a Live Activity at all: ActivityKit reads it from the
        # *app's* bundle, and `ActivityAuthorizationInfo().areActivitiesEnabled` answers false with
        # nothing in the log saying why. It belongs here for the same reason UILaunchScreen does —
        # this project supplies its own Info.plist, so no INFOPLIST_KEY_* build setting reaches it.
        NSSupportsLiveActivities: true
        # One morning wake to read today for the widgets (Store/Glance/BackgroundRefresh.swift). Background
        # app refresh is the "fetch" mode; the free developer tier has it, and no push.
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.chasebalmer.lionheart.morning-refresh]
        # The document camera reads a printed body-composition sheet; the photo stays on the phone.
        NSCameraUsageDescription: Photographs a printed body-composition sheet so its figures can be read on this phone.
        # Read only: the workouts other apps write to Health, and what Apple's own devices measure.
        NSHealthShareUsageDescription: Reads the runs, rides, hikes and walks other apps write to Apple Health, with their routes, heart rate, power and running form, so they count as training in Tempo, and what your Apple Watch and iPhone measure — VO2max, resting heart rate, HRV, gait — with your weigh-ins and date of birth.
        # Never asked for outside a Debug simulator build: only its sample-run seeding writes, and the
        # code that asks is compiled into nothing else. The text is a build setting so Release states that it does not write.
        NSHealthUpdateUsageDescription: $(LH_HEALTH_UPDATE_USAGE)
        # The API origin is a build setting, not a literal, so a device build can point at a LAN
        # address or a tunnel without touching Swift. See Configs/Base.xcconfig.
        LHAPIBaseURL: $(LH_API_BASE_URL)
        # Narrow ATS exemption for loopback and LAN hosts only. The development backend is served
        # over plain HTTP on localhost; NSAllowsArbitraryLoads would also permit it in Release,
        # which is exactly what must not happen.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  # The workout's Live Activity: the Lock Screen and Dynamic Island presentations, and nothing else.
  #
  # A separate target because a Live Activity's views are drawn by WidgetKit out of process — they
  # cannot live in the app. It holds only views; every decision they render is derived in the app
  # and arrives as `WorkoutActivityAttributes.ContentState`.
  #
  # The one app file it compiles is that attributes type, which both processes have to agree on
  # byte for byte. Sharing it as a source file rather than through a framework keeps the shared
  # surface visible here, in one line, instead of in a target graph.
  LionheartWorkoutActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LionheartWorkoutActivity
      - path: Lionheart/Core/Derived/ActiveWorkout/WorkoutActivityAttributes.swift
      # The activity draws in the app's palette — the Brick accent above all — so the catalog is
      # compiled into the extension too rather than duplicated as literals.
      - path: Lionheart/Resources/Assets.xcassets
    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chasebalmer.lionheart.workout-activity
        PRODUCT_NAME: LionheartWorkoutActivity
        # Held equal to the app's: an extension whose version disagrees with its host is rejected
        # at install time, with a message that does not say so.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    info:
      path: LionheartWorkoutActivity/Info.plist
      properties:
        CFBundleDisplayName: Tempo Workout
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # The Home and Lock Screen widgets: readiness, and today beside the training either side of it.
  #
  # They read one file the app writes into the shared App Group and reach no server, so the app
  # files compiled in are the glance's value, its file, and the one view that draws it — listed here
  # so the surface the two processes share is visible in one place.
  LionheartWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LionheartWidgets
      - path: Lionheart/Core/Derived/TodayGlance.swift
      - path: Lionheart/Store/Glance/TodayGlanceFile.swift
      - path: Lionheart/Design/ReadinessGlanceView.swift
      # The mark in the widgets' corner, in the palette.
      - path: Lionheart/Design/Brand/ProgressionMark.swift
      - path: Lionheart/Design/Brand/BrandMark.swift
      - path: Lionheart/Design/Tokens.swift
      - path: Lionheart/Resources/Assets.xcassets
    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig
    entitlements:
      path: LionheartWidgets/LionheartWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.chasebalmer.lionheart]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chasebalmer.lionheart.widgets
        PRODUCT_NAME: LionheartWidgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    info:
      path: LionheartWidgets/Info.plist
      properties:
        CFBundleDisplayName: Tempo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  LionheartTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LionheartTests
    dependencies:
      - target: Lionheart
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chasebalmer.lionheart.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Lionheart:
    build:
      targets:
        Lionheart: all
        LionheartWorkoutActivity: all
        LionheartWidgets: all
        LionheartTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - LionheartTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
