name: Lionheart

options:
  bundleIdPrefix: com.chasebalmer
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Lionheart:
    type: application
    platform: iOS
    sources:
      - path: Lionheart
    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig
    # HealthKit, read-only: Lionheart reads the workouts other apps write to Apple Health and never
    # writes there itself (a Debug build may seed invented runs into a simulator's store; see
    # Health/SampleRuns.swift). The capability is available on the free developer tier.
    entitlements:
      path: Lionheart/Lionheart.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    dependencies:
      # Embeds the widget extension in the app's PlugIns folder, which is the only way a Live
      # Activity's views are ever found: ActivityKit renders them in the extension's process, so an
      # app that links ActivityKit but ships no extension can request an activity and will only
      # ever draw a blank one.
      - target: LionheartWorkoutActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chasebalmer.lionheart
        PRODUCT_NAME: Lionheart
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: ""
        CODE_SIGN_STYLE: Automatic
        # Code signing stays on even for the simulator, which signs ad-hoc and needs no team.
        # Turning it off strips the application-identifier entitlement, and without that every
        # Keychain write fails with errSecMissingEntitlement — so the athlete would appear to sign
        # in and be signed out again on the next launch, with nothing saying why.
    info:
      path: Lionheart/Info.plist
      properties:
        CFBundleDisplayName: Lionheart
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIUserInterfaceStyle: Automatic
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Declaring a launch screen is what tells iOS the app is built for the full display. Without
        # it the app runs letterboxed in compatibility mode on every modern device — and because
        # this project supplies its own Info.plist, the INFOPLIST_KEY_UILaunchScreen_Generation
        # build setting never reaches it. An empty dictionary is the whole declaration.
        UILaunchScreen: {}
        # Without this the app cannot start a Live Activity at all: ActivityKit reads it from the
        # *app's* bundle, and `ActivityAuthorizationInfo().areActivitiesEnabled` answers false with
        # nothing in the log saying why. It belongs here for the same reason UILaunchScreen does —
        # this project supplies its own Info.plist, so no INFOPLIST_KEY_* build setting reaches it.
        NSSupportsLiveActivities: true
        # The document camera reads a printed body-composition sheet; the photo stays on the phone.
        NSCameraUsageDescription: Photographs a printed body-composition sheet so its figures can be read on this phone.
        # Read only: the workouts other apps write to Health, with their routes, heart rate and metrics.
        NSHealthShareUsageDescription: Reads the runs, rides, hikes and walks other apps write to Apple Health, with their routes, heart rate, power and running form, so they count as training in Lionheart.
        # Never asked for outside a Debug simulator build: only its sample-run seeding writes, and the
        # code that asks is compiled into nothing else. The text is a build setting so Release states that it does not write.
        NSHealthUpdateUsageDescription: $(LH_HEALTH_UPDATE_USAGE)
        # The API origin is a build setting, not a literal, so a device build can point at a LAN
        # address or a tunnel without touching Swift. See Configs/Base.xcconfig.
        LHAPIBaseURL: $(LH_API_BASE_URL)
        # Narrow ATS exemption for loopback and LAN hosts only. The development backend is served
        # over plain HTTP on localhost; NSAllowsArbitraryLoads would also permit it in Release,
        # which is exactly what must not happen.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  # The workout's Live Activity: the Lock Screen and Dynamic Island presentations, and nothing else.
  #
  # A separate target because a Live Activity's views are drawn by WidgetKit out of process — they
  # cannot live in the app. It holds only views; every decision they render is derived in the app
  # and arrives as `WorkoutActivityAttributes.ContentState`.
  #
  # The one app file it compiles is that attributes type, which both processes have to agree on
  # byte for byte. Sharing it as a source file rather than through a framework keeps the shared
  # surface visible here, in one line, instead of in a target graph.
  LionheartWorkoutActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LionheartWorkoutActivity
      - path: Lionheart/Core/Derived/ActiveWorkout/WorkoutActivityAttributes.swift
      # The accent is the app's one brand token and the activity has to inherit it, so the catalog
      # is compiled into the extension too rather than duplicated as a literal.
      - path: Lionheart/Resources/Assets.xcassets
    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chasebalmer.lionheart.workout-activity
        PRODUCT_NAME: LionheartWorkoutActivity
        # Held equal to the app's: an extension whose version disagrees with its host is rejected
        # at install time, with a message that does not say so.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    info:
      path: LionheartWorkoutActivity/Info.plist
      properties:
        CFBundleDisplayName: Lionheart Workout
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  LionheartTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LionheartTests
    dependencies:
      - target: Lionheart
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chasebalmer.lionheart.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Lionheart:
    build:
      targets:
        Lionheart: all
        LionheartWorkoutActivity: all
        LionheartTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - LionheartTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
